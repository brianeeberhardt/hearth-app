<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hearth" />
    <meta name="theme-color" content="#14110e" />
    <title>Hearth</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>Hearth</h1>
          <p>Amber’s library · Ada on the desk</p>
        </div>
        <div class="top-actions">
          <button class="pill gold" id="addBtn">Add</button>
        </div>
      </header>
      <div class="search-wrap">
        <input class="search" id="searchBox" type="search" placeholder="Search title, author, ISBN, person…" />
      </div>
      <main class="main">
        <section class="screen" id="home"></section>
        <section class="screen hidden" id="loans"></section>
        <section class="screen hidden" id="statsView"></section>
        <section class="screen hidden" id="peopleView"></section>
        <section class="screen hidden" id="settingsView"></section>
      </main>
      <nav class="nav">
        <button class="on" data-view="home"><span class="glyph">▣</span>Shelf</button>
        <button data-view="loans"><span class="glyph">↗</span>Loans</button>
        <button data-view="stats"><span class="glyph">◍</span>Stats</button>
        <button data-view="people"><span class="glyph">☺</span>People</button>
        <button data-view="settings"><span class="glyph">⚙</span>Data</button>
      </nav>
    </div>
    <div class="sheet" id="sheet"><div class="sheet-card" id="sheetBody"></div></div>
    <div class="toast" id="toast"></div>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
